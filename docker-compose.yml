services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DB_PATH=/data/opsboard.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-32bytes!!!}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_MAX_ATTEMPTS=${AUTH_MAX_ATTEMPTS:-5}
      - AUTH_LOCKOUT_MINUTES=${AUTH_LOCKOUT_MINUTES:-15}
      - AUTH_TOKEN_EXPIRE_HOURS=${AUTH_TOKEN_EXPIRE_HOURS:-24}
    volumes:
      - backend-data:/data
    networks:
      - internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    networks:
      - internal
    depends_on:
      - backend

volumes:
  backend-data:

networks:
  internal:
