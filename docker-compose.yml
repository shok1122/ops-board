services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DB_PATH=/data/opsboard.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-32bytes!!!}
    volumes:
      - backend-data:/data
    networks:
      - internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    networks:
      - internal
    depends_on:
      - backend

volumes:
  backend-data:

networks:
  internal:
